<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Comunícate con nosotros! - Artesanías Susurros del Viento</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css?family=Quicksand&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logooo.ico">
</head>
<body>
  <main class="container">
    <div class="contact-box">
      <div class="left"></div>
      <section class="right">
        <h2>Contáctanos</h2>
        <form action="#" method="POST">
          <label for="nombre" class="visually-hidden">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="field" placeholder="Tu nombre" required>

          <label for="email" class="visually-hidden">Correo electrónico</label>
          <input type="email" id="email" name="email" class="field" placeholder="Tu email" required>

          <label for="telefono" class="visually-hidden">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" class="field" placeholder="Teléfono">

          <label for="mensaje" class="visually-hidden">Mensaje</label>
          <textarea id="mensaje" name="mensaje" placeholder="Mensaje" class="field" required></textarea>

          <button type="submit" class="btn">Enviar</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
